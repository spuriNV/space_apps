services:
  - type: web
    name: field-shift
    runtime: docker
    plan: free   # free plans sleep after idle (slow first load); use starter to stay awake
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Not required: the app serves the committed cache. Only needed for refreshing data.
      - key: EARTHDATA_USERNAME
        sync: false
      - key: EARTHDATA_PASSWORD
        sync: false
      - key: OPENET_API_KEY
        sync: false
      - key: CIMIS_APP_KEY
        sync: false
      - key: NASS_API_KEY
        sync: false
      - key: AMS_API_KEY
        sync: false
