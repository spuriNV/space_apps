name: Deploy Pages
on:
  push:
    branches: [main]
    paths: ["frontend/**", "backend/**", "data/**", "fixtures/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - name: Export static API JSON (committed cache only, no keys, no .env)
        working-directory: backend/api
        run: uv run --python 3.12 python export_static.py
      - name: Build
        working-directory: frontend/app
        env:
          VITE_BASE: /space_apps/
        run: |
          npm ci
          npm run build:static
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/app/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
