# XcodeGen spec for the CropLytics iOS app. Regenerate the project with:
#   cd apps/ios && xcodegen generate
# The generated CropLytics.xcodeproj is committed so the app opens without XcodeGen,
# but this file is the source of truth: edit here, then regenerate.
name: CropLytics
options:
  bundleIdPrefix: org.croplytics
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  CropLytics:
    type: application
    platform: iOS
    sources:
      - path: CropLytics
        excludes:
          - "Resources/Fixtures"
          - "Info.plist"
          # Xcode 16.4's asset compiler needs an iOS 18 simulator runtime, which this Mac doesn't have
          # (only 17.4/17.5). The catalog (1024 pt App Store icon, accent colour) is kept for release
          # builds on a machine with the iOS 18.5 runtime; re-include it there. See README.
          - "Resources/Assets.xcassets"
      # Example payloads from the live API: used by the UI tests (-ui-testing), unit tests and SwiftUI previews.
      - path: CropLytics/Resources/Fixtures
        type: folder
        buildPhase: resources
    info:
      path: CropLytics/Info.plist
      properties:
        CFBundleDisplayName: CropLytics
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon60x60
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - ZillaSlab-Medium.ttf
          - ZillaSlab-SemiBold.ttf
          - LibreFranklin-Regular.ttf
          - LibreFranklin-SemiBold.ttf
          - LibreFranklin-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.croplytics.CropLytics
        PRODUCT_NAME: CropLytics
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  CropLyticsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CropLyticsTests
    dependencies:
      - target: CropLytics
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.croplytics.CropLyticsTests
  CropLyticsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CropLyticsUITests
    dependencies:
      - target: CropLytics
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.croplytics.CropLyticsUITests
        TEST_TARGET_NAME: CropLytics
schemes:
  CropLytics:
    build:
      targets:
        CropLytics: all
        CropLyticsTests: [test]
        CropLyticsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - CropLytics
      targets:
        - name: CropLyticsTests
          parallelizable: false
        - name: CropLyticsUITests
          parallelizable: false
    archive:
      config: Release
