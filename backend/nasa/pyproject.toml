[project]
name = "fieldshift-nasa"
version = "0.1.0"
description = "Field Shift: Earthdata-keyed NASA dataset fetchers (IMERG, SMAP, GRACE-DA, MODIS, ECOSTRESS, OPERA DSWx)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "earthaccess>=0.14",
  "requests>=2.31",
  "pandas>=2.2",
  "pyarrow>=16",
  "numpy>=1.26",
  "xarray>=2024.6",
  "h5netcdf>=1.3",
  "h5py>=3.11",
  "shapely>=2.0",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fieldshift_nasa"]
