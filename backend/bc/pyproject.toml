[project]
name = "fieldshift-bc"
version = "0.1.0"
description = "CropLytics British Columbia example field (Salmon River / Shuswap): outline, AAFC crop history, ECCC stations, SoilGrids, API payloads"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyproj>=3.6",
    "rasterio>=1.4",
    "requests>=2.31",
    "scipy>=1.13",
    "shapely>=2.0",
]

[tool.uv]
package = false
